  <body class="bg-[#0a0a0a] text-[#ededed] antialiased selection:bg-[#262626] selection:text-[#ffffff] min-h-screen">
    <!-- Aggressive SW killer — runs inline (before any module) on localhost to prevent MIME interception -->
    <script>
      (function() {
        var isLocal = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isLocal) return;
        if (!('serviceWorker' in navigator)) return;
        // Unregister all registered service workers
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          regs.forEach(function(reg) {
            reg.unregister().then(function(ok) {
              if (ok) console.log('[SW Killer] Unregistered:', reg.scope);
            });
          });
        });
        // Nuke all caches
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(k) { caches.delete(k); });
          });
        }
        // If a SW is actively controlling this page, claim bypass by reloading once
        if (navigator.serviceWorker.controller) {
          var reloaded = sessionStorage.getItem('_sw_reload');
          if (!reloaded) {
            sessionStorage.setItem('_sw_reload', '1');
            navigator.serviceWorker.controller.postMessage({ type: 'SKIP_WAITING' });
            window.location.reload();
          }
        } else {
          sessionStorage.removeItem('_sw_reload');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
